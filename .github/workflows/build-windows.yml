name: Build Windows packages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      console:
        description: "生成带控制台的诊断版本"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: windows-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      UV_PROJECT_ENVIRONMENT: .venv-build-windows

    steps:
      # 固定 Action 提交，避免上游标签变化导致构建行为改变。
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked --python 3.13 --group dev --group build python -m pytest -q

      - name: Build single-file EXE
        shell: pwsh
        env:
          BUILD_CONSOLE: ${{ inputs.console }}
        run: |
          if ($env:BUILD_CONSOLE -eq "true") {
            & .\scripts\build_windows.bat --console
          } else {
            & .\scripts\build_windows.bat
          }
          exit $LASTEXITCODE

      - name: Prepare Inno Setup
        if: inputs.console != true
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          exit $LASTEXITCODE

      - name: Build Windows installer
        if: inputs.console != true
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Verify embedded application icons
        shell: pwsh
        run: |
          $apps = @(Get-ChildItem dist/*.exe | ForEach-Object { $_.FullName })
          if (Test-Path dist/windows/DICOMVision/DICOMVision.exe) {
            $apps += (Resolve-Path dist/windows/DICOMVision/DICOMVision.exe).Path
          }
          uv run --locked --python 3.13 --no-dev --group build python tests/manual/verify_windows_icons.py --icon build/installer-assets/app.ico @apps
          exit $LASTEXITCODE

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe, dist/installers/*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding utf8NoBOM
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DICOMVision-windows-x64${{ inputs.console && '-debug' || '' }}
          path: |
            dist/*.exe
            dist/*.sha256
            dist/installers/*.exe
            dist/installers/*.sha256
          if-no-files-found: error
          # 单文件 EXE 已压缩，避免重复压缩消耗构建时间。
          compression-level: 0
          retention-days: 14
