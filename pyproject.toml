[project]
name = "qt-dicom-viewer"
version = "0.2.0"
description = "Voxenra — DICOM viewing, MPR, PET/CT fusion and volume rendering."
readme = "README.md"
authors = [
    { name = "Jun Liu", email = "5769389@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pydicom>=3.0.2",
    "PySide6>=6.8.0",
    "vtk==9.5.2",
]

[project.scripts]
voxenra = "qt_dicom_viewer.app:main"
qt-dicom-viewer = "qt_dicom_viewer.app:main"

[dependency-groups]
build = [
    "pyinstaller==6.22.2",
    "pillow==12.3.0",
    "dmgbuild==1.6.7; sys_platform == 'darwin'",
]
dev = [
    "pytest>=9.1.1",
    "watchfiles>=1.1.0",
]

[tool.uv.dependency-groups]
build = { requires-python = ">=3.13,<3.14" }

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
