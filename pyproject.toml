[project]
name = "qt-dicom-viewer"
version = "0.1.0"
description = "A lightweight DICOM viewer built with PySide6 and QML."
readme = "README.md"
authors = [
    { name = "Jun Liu", email = "5769389@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pydicom>=3.0.2",
    "PySide6>=6.8.0",
]

[project.scripts]
qt-dicom-viewer = "qt_dicom_viewer.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "watchfiles>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
